[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-pipeline"
version = "1.2.0"
description = "Local-first image transcription and structured document intelligence pipeline, optimized for receipts."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
semantic = [
    "numpy==2.2.6",
    "requests==2.32.4",
    "urllib3>=2.2,<3",
    "charset-normalizer>=3.3,<4",
]
rag-sql = [
    "langgraph==1.2.7",
    "numpy==2.2.6",
]
openai-extraction = [
    "openai>=1.99.0",
    "pillow==11.3.0",
    "requests==2.32.4",
    "urllib3>=2.2,<3",
    "charset-normalizer>=3.3,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
receipt_intelligence = ["prompts/**/*.txt", "prompts/**/*.md", "prompts/**/*.json", "extraction/correction/config/*.json", "storage/migrations/sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast isolated tests",
    "integration: database or service integration",
    "regression: saved receipt regression suite",
    "gpu: requires locally available GPU-backed extraction models",
    "ollama: requires a reachable Ollama model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "var",
    "model_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"src/receipt_pipeline_v7_7_correction_integration/tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "^(var|model_cache)/"

name: document-intelligence-pipeline

services:
  receipt-app:
    image: paddle-gemma-receipt-app:latest
    env_file:
      - .env
    ports:
      - "7860:7860"
    environment:
      APP_HOST: "${APP_HOST:-0.0.0.0}"
      APP_PORT: "${APP_PORT:-7860}"
      APP_PROJECT_ROOT: "/app"
      VAR_DIR: "/app/var"

      # Stable PaddleOCR CPU runtime flags for the main app container.
      FLAGS_enable_pir_api: "${FLAGS_enable_pir_api:-0}"
      FLAGS_use_mkldnn: "${FLAGS_use_mkldnn:-0}"
      FLAGS_use_onednn: "${FLAGS_use_onednn:-0}"
      OCR_ENABLE_MKLDNN: "${OCR_ENABLE_MKLDNN:-0}"
      OCR_DEVICE: "${OCR_DEVICE:-cpu}"
      OCR_LANG: "${OCR_LANG:-german}"
      OCR_MAX_SIDE_LIMIT: "${OCR_MAX_SIDE_LIMIT:-4000}"
      OCR_DET_LIMIT_SIDE_LEN: "${OCR_DET_LIMIT_SIDE_LEN:-4000}"

      # Ollama runs on the Windows host / laptop, not inside this compose stack.
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:latest}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-}"

      # Keep one Gemma runner configuration across the RAG-SQL LLM stages.
      RAG_SQL_LLM_KEEP_ALIVE: "${RAG_SQL_LLM_KEEP_ALIVE:-30m}"
      RAG_SQL_LLM_NUM_CTX: "${RAG_SQL_LLM_NUM_CTX:-6144}"
      RAG_SQL_ANSWER_FORMATTER_ENABLED: "${RAG_SQL_ANSWER_FORMATTER_ENABLED:-1}"
      RAG_SQL_ANSWER_FORMATTER_MODEL: "${RAG_SQL_ANSWER_FORMATTER_MODEL:-gemma4:latest}"
      RAG_SQL_ANSWER_FORMATTER_NUM_PREDICT: "${RAG_SQL_ANSWER_FORMATTER_NUM_PREDICT:-768}"
      RAG_SQL_ANSWER_FORMATTER_TIMEOUT_SECONDS: "${RAG_SQL_ANSWER_FORMATTER_TIMEOUT_SECONDS:-120}"
      RAG_SQL_ANSWER_FORMATTER_RETRY_COUNT: "${RAG_SQL_ANSWER_FORMATTER_RETRY_COUNT:-1}"
      RAG_EMBEDDING_KEEP_ALIVE: "${RAG_EMBEDDING_KEEP_ALIVE:-30m}"

      NUM_CTX: "${NUM_CTX:-24384}"
      NUM_PREDICT: "${NUM_PREDICT:-8192}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-300}"
      LLM_JSON_RETRY_COUNT: "${LLM_JSON_RETRY_COUNT:-1}"
      OLLAMA_FORMAT_JSON: "${OLLAMA_FORMAT_JSON:-1}"
      MAX_LINES_FOR_LLM: "${MAX_LINES_FOR_LLM:-220}"
      SPATIAL_CANVAS_WIDTH: "${SPATIAL_CANVAS_WIDTH:-112}"
      VALIDATION_TOLERANCE: "${VALIDATION_TOLERANCE:-0.03}"

      # PaddleOCR-VL is a mandatory remote service for production extraction.
      VLM_BACKEND: "http_service"
      VLM_SERVICE_URL: "http://receipt-vlm:7870"
      VLM_CORRECTION_ENABLED: "${VLM_CORRECTION_ENABLED:-1}"
      VLM_TIMEOUT_SECONDS: "${VLM_TIMEOUT_SECONDS:-900}"
      VLM_SERVICE_REQUEST_TIMEOUT_SECONDS: "${VLM_SERVICE_REQUEST_TIMEOUT_SECONDS:-900}"
      VLM_MAX_CHARS: "${VLM_MAX_CHARS:-12000}"

      # No automatic Ollama unload/reload in the baseline.
      VLM_GPU_ORCHESTRATION: "${VLM_GPU_ORCHESTRATION:-none}"
      OLLAMA_UNLOAD_BEFORE_VLM: "${OLLAMA_UNLOAD_BEFORE_VLM:-0}"
      OLLAMA_RELOAD_AFTER_VLM: "${OLLAMA_RELOAD_AFTER_VLM:-0}"
      OLLAMA_CONTROL_MODE: "${OLLAMA_CONTROL_MODE:-api}"
      OLLAMA_CONTROL_TIMEOUT_SECONDS: "${OLLAMA_CONTROL_TIMEOUT_SECONDS:-120}"
      OLLAMA_GPU_HANDOFF_WAIT_SECONDS: "${OLLAMA_GPU_HANDOFF_WAIT_SECONDS:-0}"

      # Bounded persistent background jobs.
      JOB_WORKER_MAX_WORKERS: "${JOB_WORKER_MAX_WORKERS:-1}"
      JOB_QUEUE_CAPACITY: "${JOB_QUEUE_CAPACITY:-32}"
      JOB_CLAIM_LEASE_SECONDS: "${JOB_CLAIM_LEASE_SECONDS:-120}"
      JOB_MAINTENANCE_INTERVAL_SECONDS: "${JOB_MAINTENANCE_INTERVAL_SECONDS:-10}"
      JOB_RECOVER_PENDING: "${JOB_RECOVER_PENDING:-1}"

      # Item categorization.
      CATEGORIZATION_ENABLED: "${CATEGORIZATION_ENABLED:-1}"
      CATEGORIZATION_MODEL: "${CATEGORIZATION_MODEL:-gemma4:latest}"
      CATEGORIZATION_NUM_CTX: "${CATEGORIZATION_NUM_CTX:-8192}"
      CATEGORIZATION_NUM_PREDICT: "${CATEGORIZATION_NUM_PREDICT:-4096}"
      CATEGORIZATION_TIMEOUT_SECONDS: "${CATEGORIZATION_TIMEOUT_SECONDS:-180}"
      CATEGORIZATION_FORMAT_JSON: "${CATEGORIZATION_FORMAT_JSON:-1}"

      # Ask Your Receipts telemetry and readiness. VLM readiness is mandatory.
      QUERY_TELEMETRY_ENABLED: "${QUERY_TELEMETRY_ENABLED:-1}"
      QUERY_TELEMETRY_PATH: "${QUERY_TELEMETRY_PATH:-/app/var/logs/query_events.jsonl}"
      READINESS_PROBE_OLLAMA: "${READINESS_PROBE_OLLAMA:-1}"
      READINESS_REQUIRE_OLLAMA: "${READINESS_REQUIRE_OLLAMA:-0}"
      READINESS_PROBE_VLM: "1"
      READINESS_REQUIRE_VLM: "1"
      READINESS_TIMEOUT_SECONDS: "${READINESS_TIMEOUT_SECONDS:-2}"
    volumes:
      - ./var:/app/var
      - ${MODEL_CACHE_ROOT:-./model_cache}/paddleocr:/root/.paddleocr
      - ${MODEL_CACHE_ROOT:-./model_cache}/paddlex:/root/.paddlex
      - ${MODEL_CACHE_ROOT:-./model_cache}/huggingface:/root/.cache/huggingface
      - ${MODEL_CACHE_ROOT:-./model_cache}/torch:/root/.cache/torch
      - ${MODEL_CACHE_ROOT:-./model_cache}/paddle:/root/.cache/paddle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      receipt-vlm:
        condition: service_healthy

  receipt-vlm:
    image: paddle-gemma-receipt-vlm:gpu-python-cu126
    env_file:
      - .env
    expose:
      - "7870"
    gpus: all
    environment:
      VLM_SERVICE_HOST: "0.0.0.0"
      VLM_SERVICE_PORT: "7870"
      APP_PROJECT_ROOT: "/app"
      VAR_DIR: "/app/var"
      VLM_SERVICE_BACKEND: "paddleocr_vl"
      VLM_SERVICE_RUNNER: "${VLM_SERVICE_RUNNER:-cli}"
      VLM_ENGINE: "${VLM_ENGINE:-transformers}"
      PYTORCH_CUDA_WHEEL_INDEX: "cu126"

      PADDLEX_HOME: "/root/.paddlex"
      HF_HOME: "/root/.cache/huggingface"
      TRANSFORMERS_CACHE: "/root/.cache/huggingface"
      TORCH_HOME: "/root/.cache/torch"
      PADDLE_HOME: "/root/.cache/paddle"

      VLM_DEVICE: "${VLM_DEVICE:-gpu:0}"
      VLM_ALLOW_CPU_FALLBACK: "0"
      VLM_TIMEOUT_SECONDS: "${VLM_TIMEOUT_SECONDS:-900}"
      VLM_MAX_UPLOAD_MB: "${VLM_MAX_UPLOAD_MB:-25}"
      VLM_SERVICE_MAX_SIDE_LIMIT: "${VLM_SERVICE_MAX_SIDE_LIMIT:-1200}"
      VLM_ALLOWED_INPUT_ROOTS: "/app/var"
      VLM_CLI_EXTRA_ARGS: "${VLM_CLI_EXTRA_ARGS:-}"

      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      FLAGS_selected_gpus: "${CUDA_VISIBLE_DEVICES:-0}"
      PADDLE_DEVICE: "${PADDLE_DEVICE:-gpu:0}"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      FLAGS_use_mkldnn: "0"
      FLAGS_use_onednn: "0"
      FLAGS_enable_pir_api: "0"
      FLAGS_enable_pir_in_executor: "0"
    volumes:
      - ./var:/app/var
      - ${MODEL_CACHE_ROOT:-./model_cache}/paddleocr:/root/.paddleocr
      - ${MODEL_CACHE_ROOT:-./model_cache}/paddlex:/root/.paddlex
      - ${MODEL_CACHE_ROOT:-./model_cache}/huggingface:/root/.cache/huggingface
      - ${MODEL_CACHE_ROOT:-./model_cache}/torch:/root/.cache/torch
      - ${MODEL_CACHE_ROOT:-./model_cache}/paddle:/root/.cache/paddle
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7870/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

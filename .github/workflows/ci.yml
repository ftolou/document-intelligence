name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Install scoped lint tooling
        run: python -m pip install "ruff>=0.6,<1"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run maintainability quality checks
        run: python scripts/run_quality_checks.py


      - name: Generate empty regression report smoke test
        run: python scripts/generate_regression_report.py --results-dir var/jobs --out-dir var/reports/regression_report_ci

      - name: Check frontend JavaScript syntax
        run: node --check static/app.js

  docker-thin-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app runtime smoke image
        run: docker build -f docker/Dockerfile.app-runtime -t receipt-app-runtime:ci .

      - name: Build thin app image
        run: docker build -f docker/Dockerfile.app --build-arg APP_RUNTIME_IMAGE=receipt-app-runtime:ci -t receipt-app:ci .

      - name: Verify Requests dependency compatibility
        run: docker run --rm receipt-app:ci python scripts/check_dependency_compatibility.py

      - name: Run application tests in app image
        run: docker run --rm receipt-app:ci python scripts/run_tests.py

      - name: Run deterministic query regression corpus
        run: docker run --rm receipt-app:ci python scripts/run_test_profile.py regression

      - name: Verify RAG-SQL demo CLI in app image
        run: docker run --rm receipt-app:ci python scripts/demo_rag_sql_query.py --help

      - name: Build mock VLM runtime smoke image
        run: |
          cat > /tmp/Dockerfile.vlm-runtime-mock <<'DOCKERFILE'
          FROM python:3.11-slim
          WORKDIR /app
          RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/* \
              && python -m pip install --no-cache-dir flask pillow werkzeug
          CMD ["python", "vlm_service.py"]
          DOCKERFILE
          docker build -f /tmp/Dockerfile.vlm-runtime-mock -t receipt-vlm-runtime:ci .

      - name: Build thin VLM app image
        run: docker build -f docker/Dockerfile.vlm-app --build-arg VLM_RUNTIME_IMAGE=receipt-vlm-runtime:ci -t receipt-vlm:ci .

# Explicit build override for CI/CD and release builds.
services:
  receipt-app-runtime:
    image: receipt-app-runtime:py311
    build:
      context: .
      dockerfile: docker/Dockerfile.app-runtime
    profiles: ["build"]

  receipt-app:
    image: paddle-gemma-receipt-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_RUNTIME_IMAGE: receipt-app-runtime:py311
